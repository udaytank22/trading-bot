version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trading_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./trading-bot-backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://admin:password@db:5432/trading_erp?schema=public&connection_limit=20
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
      - PORT=5000
      - JWT_SECRET=devsecret123
      - REFRESH_SECRET=devrefreshsecret123
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./trading-bot-backend:/app
      - /app/node_modules
    depends_on:
      - db
      - redis

  web:
    build:
      context: ./web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
