name: Backend CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./trading-bot-backend

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: './trading-bot-backend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Lint (if configured)
      run: npm run lint --if-present

    - name: Setup Database
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/testing_db?schema=public

    - name: Run Tests
      run: npm test
      env:
        NODE_ENV: test
        JWT_SECRET: testing-secret-key-123
        REFRESH_SECRET: testing-refresh-key-456
        DATABASE_URL: postgresql://postgres:password@localhost:5432/testing_db?schema=public

    - name: Build / Check
      run: npm run build --if-present
